
name: Model Training CICD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Train model and generate reports
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt

          python train_model.py

          echo "# RF and LR Model Scores" > report.md
          cat scores.txt >> report.md

          echo "## Confusion Matrix and Feature Importance" > report1.md

          cml publish ConfusionMatrix.png FeatureImportance.png --md >> report1.md

          cat report1.md >> report.md

          cml comment create report.md
